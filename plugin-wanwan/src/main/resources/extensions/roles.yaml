apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-wanwan-public-read
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
    # 匿名访客可读公开接口（ADR-004）
    rbac.authorization.halo.run/aggregate-to-anonymous: "true"
  annotations:
    rbac.authorization.halo.run/module: "弯弯知识导航"
    rbac.authorization.halo.run/display-name: "公开资料读取"
rules:
  - apiGroups: [ "api.wanwan.run" ]
    resources: [ "stages", "resources", "topics", "posts", "search", "notice-config" ]
    verbs: [ "get", "list" ]
  - apiGroups: [ "api.wanwan.run" ]
    resources: [ "notice-subscriptions" ]
    verbs: [ "create" ]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-wanwan-manage
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "弯弯知识导航"
    rbac.authorization.halo.run/display-name: "资料卡与专题管理"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:wanwan:manage"]
rules:
  - apiGroups: [ "wanwan.run" ]
    resources: [ "resourcecards", "topics" ]
    verbs: [ "*" ]
