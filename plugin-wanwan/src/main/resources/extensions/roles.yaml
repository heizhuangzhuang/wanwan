apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-wanwan-public-read
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
    # 匿名访客可读公开接口（ADR-004）
    rbac.authorization.halo.run/aggregate-to-anonymous: "true"
  annotations:
    rbac.authorization.halo.run/module: "弯弯知识导航"
    rbac.authorization.halo.run/display-name: "公开资料读取"
rules:
  - apiGroups: [ "api.xiaojiaoya.run", "api.wanwan.run" ]
    resources: [ "stages", "resources", "topics", "posts", "stage-posts", "search", "notice-config" ]
    verbs: [ "get", "list" ]
  - apiGroups: [ "api.xiaojiaoya.run", "api.wanwan.run" ]
    resources: [ "notice-subscriptions" ]
    verbs: [ "create" ]
  - apiGroups: [ "api.xiaojiaoya.run" ]
    resources: [ "cast-journal-config" ]
    verbs: [ "get", "list" ]
  - apiGroups: [ "api.xiaojiaoya.run" ]
    resources: [ "cast-journal", "brace-archive", "feedback" ]
    verbs: [ "create" ]
  # Halo routes these transport endpoints; FamilyEndpoint verifies its own session on each private action.
  - apiGroups: [ "family.xiaojiaoya.run" ]
    resources: [ "status" ]
    verbs: [ "get", "list" ]
  - apiGroups: [ "family.xiaojiaoya.run" ]
    resources: [ "login", "pair", "approve", "exchange", "logout", "me", "cast", "brace" ]
    verbs: [ "create" ]

---
apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-wanwan-manage
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "弯弯知识导航"
    rbac.authorization.halo.run/display-name: "资料卡与专题管理"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:wanwan:manage"]
rules:
  - apiGroups: [ "wanwan.run" ]
    resources: [ "resourcecards", "topics" ]
    verbs: [ "*" ]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-wanwan-ops
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "弯弯知识导航"
    rbac.authorization.halo.run/display-name: "运营总览"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:wanwan:ops"]
rules:
  - apiGroups: [ "console.api.xiaojiaoya.run" ]
    resources: [ "ops-overview" ]
    verbs: [ "list" ]
  - apiGroups: [ "console.api.xiaojiaoya.run" ]
    resources: [ "ops-miniprogram-checks" ]
    resourceNames: [ "trial", "formal" ]
    verbs: [ "update" ]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-wanwan-feedback
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "弯弯知识导航"
    rbac.authorization.halo.run/display-name: "功能建议处理"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:wanwan:feedback"]
rules:
  - apiGroups: [ "console.api.xiaojiaoya.run" ]
    resources: [ "feedback" ]
    verbs: [ "list", "update" ]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-wanwan-family-accounts
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "小脚丫指南"
    rbac.authorization.halo.run/display-name: "查看家庭账号的登录来源"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:wanwan:family-accounts"]
rules:
