<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{modules/layout :: html(title=${site.title}, content=~{::section})}">
<body>
  <section>
    <div class="notice-bar">
      面向产前发现胎儿疑似足内翻的家庭：按阶段整理的公开资料导航。本页展示题录、来源与本站自写介绍，点击资料可前往合法原站阅读。不提供医学诊断或替代门诊沟通。
    </div>

    <form class="search-form" th:action="@{/search}" method="get">
      <input class="search-input" type="search" name="keyword" maxlength="100"
             placeholder="搜索已收录资料标题、介绍或来源..." aria-label="搜索关键词" />
      <button class="btn" type="submit">搜索</button>
    </form>

    <h2>按阶段开始浏览</h2>
    <div class="stage-grid">
      <a class="stage-card" th:each="s : ${wanwanFinder.stages()}"
         th:href="@{/stages/{key}(key=${s.key})}">
        <div class="stage-order" th:text="'阶段 ' + (${s.order} + 1)">阶段 1</div>
        <div class="stage-name" th:text="${s.label}">刚发现</div>
      </a>
    </div>

    <th:block th:with="topics=${wanwanFinder.listTopics(1, 4)}">
      <div th:if="${topics != null and !topics.items.isEmpty()}">
        <h2>精选专题</h2>
        <div class="card-list">
          <article class="card" th:each="t : ${topics.items}">
            <h3 class="card-title">
              <a th:href="@{/topics/{name}(name=${t.name})}" th:text="${t.title}">专题标题</a>
            </h3>
            <p class="card-intro" th:text="${t.intro}"></p>
            <div class="meta-row">
              <span th:text="'含 ' + ${t.resourceCount} + ' 条资料'"></span>
            </div>
          </article>
        </div>
      </div>
    </th:block>

    <th:block th:with="recent=${wanwanFinder.listResources(null, null, null, 1, 6)}">
      <h2>近期整理资料</h2>
      <div class="warn-bar" th:if="${recent == null or recent.items.isEmpty()}">
        暂未发布资料卡。运营者核对收录后将陆续公开。
      </div>
      <div class="card-list" th:if="${recent != null and !recent.items.isEmpty()}">
        <th:block th:each="r : ${recent.items}">
          <th:block th:replace="~{modules/card :: card(r=${r})}" />
        </th:block>
      </div>
    </th:block>

    <th:block th:with="posts=${postFinder.list(1, 4)}">
      <div th:if="${posts != null and !posts.items.isEmpty()}">
        <h2>本站原创导读</h2>
        <div class="card-list">
          <article class="card" th:each="p : ${posts.items}">
            <h3 class="card-title">
              <a th:href="@{${p.status.permalink}}" th:text="${p.spec.title}">导读标题</a>
            </h3>
            <p class="card-intro" th:text="${p.status.excerpt}"></p>
          </article>
        </div>
      </div>
    </th:block>
  </section>
</body>
</html>
