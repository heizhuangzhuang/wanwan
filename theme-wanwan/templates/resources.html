<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{modules/layout :: html(title=${title}, content=~{::section})}">
<body>
  <section>
    <h1>资料库</h1>
    <div class="filter-bar">
      <a th:href="@{/resources(stage=${selectedStage})}" th:classappend="${selectedType == ''} ? 'active' : ''">全部类型</a>
      <a th:href="@{/resources(stage=${selectedStage}, type='INSTITUTION')}" th:classappend="${selectedType == 'INSTITUTION'} ? 'active' : ''">机构资料</a>
      <a th:href="@{/resources(stage=${selectedStage}, type='PAPER')}" th:classappend="${selectedType == 'PAPER'} ? 'active' : ''">论文题录</a>
      <a th:href="@{/resources(stage=${selectedStage}, type='FAMILY_STORY')}" th:classappend="${selectedType == 'FAMILY_STORY'} ? 'active' : ''">家庭经历</a>
      <a th:href="@{/resources(stage=${selectedStage}, type='ORIGINAL')}" th:classappend="${selectedType == 'ORIGINAL'} ? 'active' : ''">本站原创</a>
    </div>

    <div class="warn-bar" th:if="${resources.items.isEmpty()}">
      暂无符合条件的已公开资料。
    </div>

    <div class="card-list" th:if="${!resources.items.isEmpty()}">
      <th:block th:each="r : ${resources.items}">
        <th:block th:replace="~{modules/card :: card(r=${r})}" />
      </th:block>
    </div>

    <div class="pagination" th:if="${resources.total > resources.size}">
      <a th:if="${resources.page > 1}"
         th:href="@{/resources(stage=${selectedStage}, type=${selectedType}, page=${resources.page - 1})}">上一页</a>
      <span th:if="${resources.page <= 1}"></span>
      <span th:text="'第 ' + ${resources.page} + ' 页（共 ' + ${resources.total} + ' 条）'"></span>
      <a th:if="${resources.page * resources.size < resources.total}"
         th:href="@{/resources(stage=${selectedStage}, type=${selectedType}, page=${resources.page + 1})}">下一页</a>
      <span th:if="${resources.page * resources.size >= resources.total}"></span>
    </div>
  </section>
</body>
</html>
