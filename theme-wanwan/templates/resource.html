<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{modules/layout :: html(title=${resource.title}, content=~{::section})}">
<body>
  <section>
    <p><a th:href="@{/resources}">← 返回资料库</a></p>

    <article class="card">
      <div class="meta-row" style="margin-bottom: 8px;">
        <span class="badge" th:switch="${resource.materialType?.name()}">
          <span th:case="'INSTITUTION'">机构资料</span>
          <span th:case="'PAPER'">论文题录</span>
          <span th:case="'FAMILY_STORY'">家庭经历</span>
          <span th:case="'ORIGINAL'">本站原创</span>
          <span th:case="*">资料</span>
        </span>
        <span class="badge" th:switch="${resource.access?.name()}">
          <span th:case="'OPEN'">公开可读</span>
          <span th:case="'LOGIN_REQUIRED'">原站需要登录</span>
          <span th:case="'MAY_BE_PAID'">原站可能付费</span>
          <span th:case="*">访问条件未确认</span>
        </span>
      </div>

      <h1 class="card-title" style="font-size: 1.35rem;" th:text="${resource.title}"></h1>
      <p class="card-orig-title"
         th:if="${resource.originalTitle != null and resource.originalTitle != resource.title}"
         th:text="'原标题：' + ${resource.originalTitle}"></p>

      <div class="notice-bar">
        <strong>本站独立介绍：</strong>
        <span th:text="${resource.intro}"></span>
      </div>

      <div class="meta-row" style="margin-bottom: 14px;">
        <span>来源站名：<strong th:text="${resource.sourceName}"></strong></span>
        <span th:if="${resource.author != null and !#strings.isEmpty(resource.author)}"
              th:text="'作者/机构：' + ${resource.author}"></span>
        <span th:text="'原文发布日期：' + (${resource.publishedDate != null and !#strings.isEmpty(resource.publishedDate)} ? ${resource.publishedDate} : '未注明')"></span>
        <span th:if="${resource.lastVerifiedDate != null and !#strings.isEmpty(resource.lastVerifiedDate)}"
              th:text="'最后核对日期：' + ${resource.lastVerifiedDate}"></span>
        <span th:if="${resource.doi != null and !#strings.isEmpty(resource.doi)}"
              th:text="'DOI：' + ${resource.doi}"></span>
        <span th:if="${resource.pmid != null and !#strings.isEmpty(resource.pmid)}"
              th:text="'PMID：' + ${resource.pmid}"></span>
        <span th:if="${resource.storyContext != null and !#strings.isEmpty(resource.storyContext)}"
              th:text="'经历背景：' + ${resource.storyContext}"></span>
      </div>

      <div class="warn-bar" th:if="${resource.linkStatus?.name() == 'SOURCE_RETRACTED'}">
        该资料原文已被原站撤回或下线，已暂停正常推荐；仅保留题录核查记录。
      </div>
      <div class="warn-bar" th:if="${resource.linkStatus?.name() == 'NEEDS_RECHECK'}">
        原文目前不可访问，稍后复核。以下保留原始出处信息供核对。
      </div>

      <div th:if="${resource.linkStatus?.name() == 'OK' and resource.citationUrl != null}" style="margin-top: 14px;">
        <a class="btn" th:href="${resource.citationUrl}" target="_blank" rel="noopener noreferrer"
           th:text="'前往原站阅读（' + ${resource.sourceName} + '）'">前往原站阅读</a>
      </div>
      <p class="meta-row" th:if="${resource.citationUrl != null}" style="margin-top: 10px; word-break: break-all;">
        <span>原始出处链接：<span th:text="${resource.citationUrl}"></span></span>
      </p>

      <p class="meta-row" style="margin-top: 16px;">
        <span>发现来源失效、错误或版权问题？请查看<a th:href="@{/about}">版权与勘误联系方式</a>。</span>
      </p>
    </article>
  </section>
</body>
</html>
