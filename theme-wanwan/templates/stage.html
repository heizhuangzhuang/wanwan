<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{modules/layout :: html(title=${stage.label}, content=~{::section})}">
<body>
  <section>
    <h1 th:text="${stage.label}">阶段名称</h1>
    <p class="notice-bar">以下为手动核对后收录的公开资料。按编辑推荐阅读顺序排列，不构成个体医学建议。</p>

    <div class="filter-bar">
      <a th:href="@{/stages/{k}(k=${stage.key})}" th:classappend="${selectedType == ''} ? 'active' : ''">全部类型</a>
      <a th:href="@{/stages/{k}(k=${stage.key}, type='INSTITUTION')}" th:classappend="${selectedType == 'INSTITUTION'} ? 'active' : ''">机构资料</a>
      <a th:href="@{/stages/{k}(k=${stage.key}, type='PAPER')}" th:classappend="${selectedType == 'PAPER'} ? 'active' : ''">论文题录</a>
      <a th:href="@{/stages/{k}(k=${stage.key}, type='FAMILY_STORY')}" th:classappend="${selectedType == 'FAMILY_STORY'} ? 'active' : ''">家庭经历</a>
      <a th:href="@{/stages/{k}(k=${stage.key}, type='ORIGINAL')}" th:classappend="${selectedType == 'ORIGINAL'} ? 'active' : ''">本站原创</a>
    </div>

    <div class="warn-bar" th:if="${resources.items.isEmpty()}">
      该筛选条件下暂无已公开资料。
    </div>

    <div class="card-list" th:if="${!resources.items.isEmpty()}">
      <th:block th:each="r : ${resources.items}">
        <th:block th:replace="~{modules/card :: card(r=${r})}" />
      </th:block>
    </div>
  </section>
</body>
</html>
