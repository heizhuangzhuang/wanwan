<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{modules/layout :: html(title=${title}, content=~{::section})}">
<body>
  <section>
    <h1>精选专题</h1>
    <div class="warn-bar" th:if="${topics.items.isEmpty()}">暂无已发布专题。</div>
    <div class="card-list" th:if="${!topics.items.isEmpty()}">
      <article class="card" th:each="t : ${topics.items}">
        <h2 class="card-title">
          <a th:href="@{/topics/{name}(name=${t.name})}" th:text="${t.title}"></a>
        </h2>
        <p class="card-intro" th:text="${t.intro}"></p>
        <div class="meta-row"><span th:text="'含 ' + ${t.resourceCount} + ' 条资料'"></span></div>
      </article>
    </div>
  </section>
</body>
</html>
