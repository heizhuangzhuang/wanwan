apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-wanwan-setting
spec:
  forms:
    - group: basic
      label: 站点与联系信息
      formSchema:
        - $formkit: text
          name: contact_email
          label: 版权与勘误联系邮箱
          help: 请填写运营者真实可用邮箱（产品需求 §7），未填写前不展示虚构邮箱。
        - $formkit: text
          name: maintenance_status
          label: 当前维护状态说明
          value: "个人整理维护中；本站点仅提供公开资料导航与出处，不提供医疗诊断或个体建议。"
        - $formkit: text
          name: icp_number
          label: ICP 备案号
          help: 完成备案后填写（如 京ICP备xxxxxxxx号）
        - $formkit: text
          name: about_operator
          label: 运营者身份说明
          value: "由个人以家长及资料整理者身份运营，不具备医疗专业背景或执业资格。"
