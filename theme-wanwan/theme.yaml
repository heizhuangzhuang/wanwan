apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: theme-wanwan
spec:
  displayName: 弯弯知识导航主题
  author:
    name: 弯弯 Wanwan
    website: https://github.com/heizhuangzhuang/wanwan
  description: 面向产前发现胎儿疑似足内翻家庭的阶段式知识导航主题（服务端渲染、移动优先、不默认加载外部图片）
  version: 0.1.0
  requires: ">=2.27.0"
  settingName: theme-wanwan-setting
  configMapName: theme-wanwan-configmap
  license:
    - name: GPL-3.0
      url: https://www.gnu.org/licenses/gpl-3.0.html
  repo: https://github.com/heizhuangzhuang/wanwan
