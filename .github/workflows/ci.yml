name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  plugin-build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin-wanwan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plugin-wanwan/ui/pnpm-lock.yaml

      - name: Lint and build Console UI
        working-directory: plugin-wanwan/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build

      - name: Build and test Halo plugin
        uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test build --no-daemon

  web-and-miniprogram-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Typecheck, build, and test independent Web SSR
        working-directory: web
        run: |
          pnpm install
          pnpm typecheck
          pnpm test

      - name: Typecheck and test Mini Program public flows
        run: node --test miniprogram/test/public-flow.test.cjs
