# 本地全链路联调编排（模拟 微信云托管后端 + 独立 Web 前端 + MySQL）
# 生产环境分别部署于微信云托管与独立 Web 服务器，见 deploy/cloudrun/ 与 deploy/web-server/
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./data/halo:/root/.halo2
    ports:
      - "8090:80"
    environment:
      - PORT=80
      - MYSQL_ADDRESS=mysql:3306
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - HALO_EXTERNAL_URL=${HALO_EXTERNAL_URL}
      - WANWAN_CORS_ALLOWED_ORIGINS=${WANWAN_CORS_ALLOWED_ORIGINS:-http://localhost:3000}

  web:
    image: node:22-alpine
    restart: unless-stopped
    depends_on:
      - backend
    working_dir: /app
    volumes:
      - ../web:/app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BACKEND_API_BASE=http://backend/apis/api.xiaojiaoya.run/v1alpha1
      - SITE_TITLE=小脚丫步步指南
      - SITE_ORIGIN=http://localhost:3000
      - CONTACT_EMAIL=${CONTACT_EMAIL:-}
      - ICP_NUMBER=${ICP_NUMBER:-}
    command: ["sh", "-c", "node dist/server.js"]
